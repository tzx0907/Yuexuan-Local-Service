<!doctype html><meta charset="utf-8"><title>悦选限时购管理</title><style>body{margin:0;background:#f4f8ff;font:14px Arial;color:#17324d}header{background:#1677ff;color:#fff;padding:18px 7%;font-size:20px}main{max-width:1100px;margin:24px auto}.card{background:#fff;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 4px 16px #1677ff15}input,button{padding:9px;margin:4px;border-radius:6px;border:1px solid #d7e7ff}button{background:#1677ff;color:#fff;border:0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #edf2f7;text-align:left}.off{background:#ff7a45}.msg{color:#e55}</style><header>悦选本地到家服务平台 · 限时购管理</header><main><section class="card"><h2>创建活动</h2><input id="sku" placeholder="SKU ID" type="number"><input id="price" placeholder="活动价" type="number" step=".01"><input id="stock" placeholder="活动配额" type="number"><input id="limit" placeholder="每人限购" type="number"><input id="start" type="datetime-local"><input id="end" type="datetime-local"><button onclick="add()">创建</button><p class="msg" id="m"></p></section><section class="card"><h2>活动列表 <button onclick="load()">刷新</button></h2><table><thead><tr><th>ID</th><th>SKU</th><th>活动价</th><th>已售/配额</th><th>限购</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const api='/api/flash-sale',h={'Content-Type':'application/json',token:localStorage.token||''};async function q(u,o){let r=await fetch(u,{headers:h,...o}),j=await r.json();if(j.code!==1)throw Error(j.msg||'操作失败');return j.data}async function load(){try{let a=await q(api+'/list');rows.innerHTML=a.map(x=>`<tr><td>${x.id}</td><td>${x.skuId}</td><td>¥${x.salePrice}</td><td>${x.soldStock}/${x.activityStock}</td><td>${x.perUserLimit}</td><td>${x.startTime}<br>${x.endTime}</td><td>${x.status?'启用':'停用'}</td><td><button class="${x.status?'off':''}" onclick="toggle(${x.id},${x.status?0:1})">${x.status?'停用':'启用'}</button></td></tr>`).join('')}catch(e){m.textContent=e.message}}async function add(){try{await q(api,{method:'POST',body:JSON.stringify({skuId:+sku.value,salePrice:+price.value,activityStock:+stock.value,perUserLimit:+limit.value,status:1,startTime:start.value.replace('T',' ')+':00',endTime:end.value.replace('T',' ')+':00'})});m.textContent='创建成功';load()}catch(e){m.textContent=e.message}}async function toggle(i,s){try{await q(`${api}/${i}/status/${s}`,{method:'PUT'});load()}catch(e){m.textContent=e.message}}load()</script>
