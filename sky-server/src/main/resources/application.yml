server:
  port: 8080
spring:
  application:
    name: yuexuan-local-service
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}
  rabbitmq:
    host: ${sky.rabbitmq.host}
    port: ${sky.rabbitmq.port}
    username: ${sky.rabbitmq.username}
    password: ${sky.rabbitmq.password}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    # 新 Docker 库先由 Compose 导入基础 Schema，再以 0 为基线执行历史升级。
    # 已手工完整迁移的库应在 application-dev.yml 覆盖为 23，避免重复执行 V2.1～V23。
    baseline-version: ${YUEXUAN_FLYWAY_BASELINE_VERSION:0}
    baseline-description: yuexuan-existing-schema
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info
sky:
  jwt:
    # 仅提供占位默认值；本地 application-dev.yml 或环境变量必须覆盖为自己的安全值。
    admin-secret-key: ${YUEXUAN_ADMIN_JWT_SECRET:CHANGE_ME_ADMIN_JWT_SECRET}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${YUEXUAN_USER_JWT_SECRET:CHANGE_ME_USER_JWT_SECRET}
    user-ttl: 7200000
    user-token-name: authentication
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    mchid: ${sky.wechat.mchid}
    mchSerialNo: ${sky.wechat.mch-serial-no}
    privateKeyFilePath: ${sky.wechat.private-key-file-path}
    ApiV3Key: ${sky.wechat.api-v3-key}
    weChatPayCertFilePath: ${sky.wechat.wechat-pay-cert-file-path}
    notifyUrl: ${sky.wechat.notify-url}
    refundNotifyUrl: ${sky.wechat.refund-notify-url}
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
