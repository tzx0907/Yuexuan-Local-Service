<!doctype html><meta charset="utf-8"><title>悦选本地到家服务平台</title><style>body{margin:0;font:16px Arial;background:#eef6ff}.app{min-height:100vh;display:flex}.brand{width:52%;padding:12vh 9%;background:#1677ff;color:#fff}.brand b{font-size:30px}.brand h1{margin-top:18vh;font-size:46px}.login{width:48%;display:grid;place-items:center}.card{width:360px;background:#fff;padding:40px;border-radius:16px;box-shadow:0 15px 45px #1677ff33}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px}input{border:1px solid #d9e8fb}button{border:0;background:#1677ff;color:#fff;font-size:16px}.err{color:#e55;height:20px}</style><div class="app"><section class="brand"><b>悦选 · YUEXUAN</b><p>本地到家服务平台 · 管理端</p><h1>让社区生活<br>更快一步</h1><p>管理商品、服务、订单和限时购活动。</p></section><main class="login"><form class="card" onsubmit="go(event)"><h2>管理员登录</h2><p>欢迎进入悦选本地到家服务平台</p><input id="u" value="admin" placeholder="账号"><input id="p" type="password" placeholder="密码"><button>登录</button><div class="err" id="m"></div></form></main></div><script>async function go(e){e.preventDefault();m.textContent='';try{let r=await fetch('/api/employee/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),j=await r.json();if(j.code!==1)throw Error(j.msg||'账号或密码错误');localStorage.token=j.data.token;location='/sky/admin-flash-sale.html'}catch(x){m.textContent=x.message}}</script>
